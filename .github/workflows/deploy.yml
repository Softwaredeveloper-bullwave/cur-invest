name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'investingapp/backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - instance_id: i-0c534460747b8febc
            service_name: gunicorn
          - instance_id: i-0f89f9da55b050d0c
            service_name: bullwave
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ matrix.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "export HOME=/root",
              "cd /home/ubuntu/cur-invest/investingapp/backend",
              "git config --global --add safe.directory /home/ubuntu/cur-invest",
              "git pull origin main",
              "source venv/bin/activate",
              "pip install -r requirements.txt",
              "python manage.py migrate",
              "sudo systemctl restart ${{ matrix.service_name }}",
              "sleep 3",
              "curl -sf http://127.0.0.1:8000/health/ | head -c 200"
            ]' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 5

          STATUS="InProgress"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ matrix.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" ]]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ matrix.instance_id }}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
