name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'investingapp/backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - host_secret: DEPLOY_HOST_1
            service_name: gunicorn
          - host_secret: DEPLOY_HOST_2
            service_name: bullwave
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/cur-invest/investingapp/backend
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            sudo systemctl restart ${{ matrix.service_name }}
            sleep 3
            curl -sf http://127.0.0.1:8000/health/ | head -c 200
