<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    html, body, #chart { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050503; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #legend {
      position: absolute; z-index: 3; top: 10px; left: 12px; pointer-events: none;
      color: #f5f5f0; font-size: 11px; font-weight: 700; letter-spacing: .02em;
      padding: 5px 8px; border: 1px solid rgba(255,255,255,.08);
      border-radius: 7px; background: rgba(5,5,3,.72); backdrop-filter: blur(8px);
    }
    #attribution {
      position: absolute; z-index: 3; left: 8px; bottom: 4px; color: #8a8a85;
      font-size: 9px; text-decoration: none; opacity: .75;
    }
  </style>
</head>
<body>
  <div id="chart"></div>
  <div id="legend">Move over chart for OHLCV</div>
  <a id="attribution" href="https://www.tradingview.com/" target="_blank" rel="noopener">Charts by TradingView</a>
  <script src="lightweight-charts.standalone.production.js"></script>
  <script>
    (() => {
      const container = document.getElementById('chart');
      const legend = document.getElementById('legend');
      let chart;
      let mainSeries;
      let volumeSeries;
      let sma20Series;
      let sma50Series;
      let currentType = 'candlestick';
      let currentPayload;

      const emit = (type, message) => {
        const data = JSON.stringify({ type, message: message || '' });
        if (window.BullWaveChartBridge && window.BullWaveChartBridge.postMessage) {
          window.BullWaveChartBridge.postMessage(data);
        }
        if (window.parent !== window) {
          window.parent.postMessage({ source: 'bullwave-lightweight-chart', type, message: message || '' }, '*');
        }
      };

      const colorsFor = (theme) => theme === 'light'
        ? { bg: '#f4f4f0', text: '#31312e', grid: 'rgba(49,49,46,.10)', border: '#d8d8d1' }
        : { bg: '#050503', text: '#c9c9c2', grid: 'rgba(255,255,255,.075)', border: '#252522' };

      function createBaseChart(theme) {
        const colors = colorsFor(theme);
        chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: container.clientHeight,
          autoSize: true,
          layout: {
            background: { type: LightweightCharts.ColorType.Solid, color: colors.bg },
            textColor: colors.text,
            attributionLogo: false,
          },
          grid: {
            vertLines: { color: colors.grid, style: LightweightCharts.LineStyle.Dotted },
            horzLines: { color: colors.grid, style: LightweightCharts.LineStyle.Dotted },
          },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
            vertLine: { color: '#c6ff00', width: 1, style: LightweightCharts.LineStyle.Dashed, labelBackgroundColor: '#202020' },
            horzLine: { color: '#c6ff00', width: 1, style: LightweightCharts.LineStyle.Dashed, labelBackgroundColor: '#202020' },
          },
          rightPriceScale: { borderColor: colors.border, scaleMargins: { top: .08, bottom: .28 } },
          timeScale: { borderColor: colors.border, timeVisible: true, secondsVisible: false, rightOffset: 3 },
          handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
          handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
          kineticScroll: { mouse: true, touch: true },
        });

        volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
          priceFormat: { type: 'volume' },
          priceScaleId: 'volume',
          lastValueVisible: false,
          priceLineVisible: false,
        });
        volumeSeries.priceScale().applyOptions({ scaleMargins: { top: .78, bottom: 0 } });

        chart.subscribeCrosshairMove((param) => {
          if (!param || !param.time || !mainSeries || !currentPayload) {
            legend.textContent = currentPayload ? `${currentPayload.symbol} · ${currentPayload.interval}` : 'Move over chart for OHLCV';
            return;
          }
          const bar = param.seriesData.get(mainSeries);
          const vol = volumeSeries ? param.seriesData.get(volumeSeries) : null;
          if (!bar) return;
          const open = bar.open ?? bar.value;
          const high = bar.high ?? bar.value;
          const low = bar.low ?? bar.value;
          const close = bar.close ?? bar.value;
          legend.textContent = `O ${Number(open).toFixed(2)}  H ${Number(high).toFixed(2)}  L ${Number(low).toFixed(2)}  C ${Number(close).toFixed(2)}${vol ? `  V ${Number(vol.value).toLocaleString()}` : ''}`;
        });
      }

      function addMainSeries(type) {
        if (mainSeries) chart.removeSeries(mainSeries);
        currentType = type;
        if (type === 'line') {
          mainSeries = chart.addSeries(LightweightCharts.LineSeries, {
            color: '#c6ff00', lineWidth: 2, priceLineVisible: true,
          });
        } else if (type === 'area') {
          mainSeries = chart.addSeries(LightweightCharts.AreaSeries, {
            lineColor: '#c6ff00', topColor: 'rgba(198,255,0,.32)',
            bottomColor: 'rgba(198,255,0,.02)', lineWidth: 2,
          });
        } else {
          mainSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: '#18c964', downColor: '#ff5a67',
            borderUpColor: '#18c964', borderDownColor: '#ff5a67',
            wickUpColor: '#18c964', wickDownColor: '#ff5a67',
          });
        }
      }

      function setOverlay(existing, data, color) {
        if (existing) chart.removeSeries(existing);
        if (!data || data.length === 0) return null;
        const series = chart.addSeries(LightweightCharts.LineSeries, {
          color, lineWidth: 1, priceLineVisible: false,
          lastValueVisible: false, crosshairMarkerVisible: false,
        });
        series.setData(data);
        return series;
      }

      function setData(payload) {
        try {
          currentPayload = payload;
          if (!chart) createBaseChart(payload.theme || 'dark');
          if (!mainSeries || currentType !== payload.chartType) addMainSeries(payload.chartType || 'candlestick');

          const mainData = currentType === 'candlestick'
            ? payload.candles
            : payload.candles.map((bar) => ({ time: bar.time, value: bar.close }));
          mainSeries.setData(mainData);
          volumeSeries.setData(payload.showVolume ? payload.volume : []);
          sma20Series = setOverlay(sma20Series, payload.showSma ? payload.sma20 : [], '#38bdf8');
          sma50Series = setOverlay(sma50Series, payload.showSma ? payload.sma50 : [], '#f59e0b');
          legend.textContent = `${payload.symbol} · ${payload.interval}`;
          chart.timeScale().fitContent();
          emit('ready');
        } catch (error) {
          emit('error', String(error));
        }
      }

      window.BullWaveChart = { setData };
      window.addEventListener('message', (event) => {
        let message = event.data;
        if (typeof message === 'string') {
          try { message = JSON.parse(message); } catch (_) { return; }
        }
        if (message && message.source === 'bullwave-lightweight-chart' && message.payload) {
          setData(message.payload);
        }
      });
      emit('loaded');
    })();
  </script>
</body>
</html>
