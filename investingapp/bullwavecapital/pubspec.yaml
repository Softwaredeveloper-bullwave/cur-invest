name: bullwave_invest
description: Capital BullWave — Market Learning & Paper Trading Simulator (no real money)
publish_to: 'none'
version: 1.2.0+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  lottie: ^3.1.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  http: ^1.2.2
  http_parser: ^4.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  camera_desktop: ^1.2.1
  image: ^4.5.4
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  speech_to_text: ^7.0.0
  record: ^7.1.1
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  phosphoricons_flutter: ^1.0.0
  webview_flutter: ^4.14.1
  flutter_cashfree_pg_sdk: ^2.4.0
  package_info_plus: ^10.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/capital_bullwave_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/capital_bullwave_logo.png
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/capital_bullwave_logo.png
    background_color: "#FFFFFF"
    theme_color: "#0A0A0A"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/lottie/
    - assets/data/
    - assets/charts/
